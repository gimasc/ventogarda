name: Aggiorna grafico vento

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa librerie
        run: pip install requests matplotlib pytz

      - name: Genera grafico
        env:
          TZ: Europe/Rome
        run: python vento_torbole.py

      - name: Salva il PNG nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add vento_torbole.png
          git commit -m "Aggiorna grafico vento" || echo "Nessuna modifica"
          git push
